allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# Force single Vue version to prevent duplicate runtime issues
# Nuxt UI 4.10 requires vue ^3.5.39 while Nuxt 4.4.8 ships with 3.5.35
# Having two copies causes: "Cannot define property inputRef, object is not extensible"
overrides:
  vue: ^3.5.40
  '@vue/compiler-core': ^3.5.40
  '@vue/compiler-dom': ^3.5.40
  '@vue/compiler-sfc': ^3.5.40
  '@vue/compiler-ssr': ^3.5.40
  '@vue/reactivity': ^3.5.40
  '@vue/runtime-core': ^3.5.40
  '@vue/runtime-dom': ^3.5.40
  '@vue/server-renderer': ^3.5.40
  '@vue/shared': ^3.5.40
  reka-ui: 2.10.1
